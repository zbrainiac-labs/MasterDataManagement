version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/nrt"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pip"
    directory: "/nrt"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

name: CI

# Job "sonar": offline unit tests + Trivy + SonarQube scan against the
# DataOpsBackbone stack. Fails on test failures, HIGH/CRITICAL Trivy findings,
# a failed quality gate, or any HIGH/BLOCKER/CRITICAL issue.
# Same script as local runs: bash local-ci/sonar-self-scan.sh
# Job "image": multi-platform (amd64 + arm64) build + smoke test of nrt/Dockerfile.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    # DataOpsBackbone runners: on sonarnet with the sonar-init token at /sonar
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # SCM blame for new-code detection
      - name: Tests + SonarQube quality gate
        run: bash local-ci/sonar-self-scan.sh
      - name: Upload issue list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sonar-issues
          path: .sonar-issues.tsv
          if-no-files-found: ignore

  # Multi-platform build of the NRT image. Each platform builds natively on its
  # own GitHub-hosted runner (no QEMU), same pattern as DataOpsBackbone CI.
  # Build + smoke test only; nothing is pushed.
  image:
    name: nrt image (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {name: linux/amd64, arch: amd64, runner: ubuntu-latest}
          - {name: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm}
    env:
      IMAGE: mdm-nrt:ci-${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build (${{ matrix.platform.name }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./nrt
          platforms: ${{ matrix.platform.name }}
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=nrt-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=nrt-${{ matrix.platform.arch }},mode=max
      - name: Smoke test
        run: |
          set -Eeuo pipefail
          test "$(docker image inspect -f '{{.Architecture}}' "$IMAGE")" = "${{ matrix.platform.arch }}"
          test "$(docker run --rm "$IMAGE" id -u)" != "0"
          docker run --rm "$IMAGE" python -c "import nrt_mdm.api, nrt_mdm.consumer, nrt_mdm.batch_resolve"
          docker run --rm "$IMAGE" sh -c "command -v uvicorn && command -v streamlit"

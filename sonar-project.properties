# SonarQube analysis of the MasterDataManagement repo (SQL, Python, shell, notebooks, workflows).
# Local run:  bash local-ci/sonar-self-scan.sh
sonar.projectKey=MasterDataManagement-local
sonar.projectName=MasterDataManagement (local)
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Only analyse files tracked by git
sonar.scm.provider=git

# Root symlinks point into bulk/ (already analysed); images are binaries
# (test files are excluded here so they are indexed once, as tests)
sonar.exclusions=post_deploy.sql,pre_deploy.sql,sources/**,sqlunit/**,images/**,**/tests/**,**/test_*.py
sonar.test.exclusions=post_deploy.sql,pre_deploy.sql,sources/**,sqlunit/**
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test_*.py
# coverage report path is passed by local-ci/sonar-self-scan.sh

# False positive: the object-naming regex ^.{4}(RAW|AGG|...)_ matches the
# 4-space-indented templating keys raw_schema/agg_schema in the DCM manifest.
sonar.issue.ignore.multicriteria=manifest,seededrng
sonar.issue.ignore.multicriteria.manifest.ruleKey=txt:Enforce__maturity_level__Code_at_Positions_5_7
sonar.issue.ignore.multicriteria.manifest.resourceKey=manifest.yml
# Not security-relevant: the synthetic test-data generator needs a *seeded*,
# reproducible PRNG (snapshot test in shared/tests depends on it).
sonar.issue.ignore.multicriteria.seededrng.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.seededrng.resourceKey=shared/scripts/generate_test_data.py
